name: medexa-foundation-test

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: medexa_foundation_test
      POSTGRES_USER: medexa_foundation_test
      POSTGRES_PASSWORD: ${MEDEXA_TEST_DB_PASSWORD:?Set an ephemeral test password}
    tmpfs: [/var/lib/postgresql/data]
    networks: [test]
    mem_limit: 512m
    cpus: 0.5
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 2s
      timeout: 2s
      retries: 30
  check:
    build:
      context: .
      target: test
    environment:
      MEDEXA_ENVIRONMENT: test
      MEDEXA_RUN_DB_TESTS: "1"
      MEDEXA_DB_HOST: db
      MEDEXA_DB_PORT: "5432"
      MEDEXA_DB_NAME: medexa_foundation_test
      MEDEXA_DB_USER: medexa_foundation_test
      MEDEXA_DB_PASSWORD: ${MEDEXA_TEST_DB_PASSWORD:?Set an ephemeral test password}
    networks: [test]
    depends_on:
      db: {condition: service_healthy}
    init: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    mem_limit: 512m
    cpus: 0.5

networks:
  test:
    internal: true
